# Tiny LOCAL CPU smoke-test config (supervised transformer baseline). NOT for
# Lambda/GPU. Companion to test.yaml: trains the supervised baseline so the
# JEPA-vs-supervised comparison path (scripts/analyze_comparison.py) can be
# exercised locally. Supervised saves a checkpoint unconditionally at
# `epoch == epochs` (train_supervised.py), so this reliably produces artifacts.
model:
    embed_dim: 32
    encoder_heads: 4         # must divide embed_dim
    encoder_depth: 2
    encoder_ffn_dim: 64
    token_enc_heads: 2
    token_enc_depth: 1
    token_enc_ffn_dim: 64
    architecture: supervised
optimization:
    epochs: 3
    warmup_epochs: 1
    patience: 3
    base_lr: 3e-4
    min_lr: 1e-5
    weight_decay: 0.05
    betas: [0.9, 0.95]
    grad_clip: 2.0
data:
    label_key: "label_30d"   # read by train_supervised.py (data.label_key)
    batch_size: 16
    n_patients: 200          # 0=all; small subset for CPU
    max_encounters: 8
    pin_mem: false           # CPU
    num_workers: 0
meta:
    seed: 42
    label_key: "label_30d"   # read by loaders.load_scaffolding (meta.label_key)
    tag: "test_supervised"
    description: "Tiny local CPU smoke-test supervised baseline. Pairs with test.yaml for analyze_comparison."
    resume_from: null
    ckpt_cycle: 1
