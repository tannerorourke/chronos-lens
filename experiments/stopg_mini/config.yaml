model:
    embed_dim: 48
    num_heads: 2
    num_layers: 2
    ffn_dim: 192
    max_seq_len: 128
    predictor_embed_dim: 32
    predictor_depth: 2
    architecture: stopgrad # stopgrad | ema | transformer
optimization:
    epochs: 50
    base_lr: 1e-4
    schedule: "warmup_cosine"
    min_lr_ratio: 0.1
    weight_decay: 0.05
    betas: [0.9, 0.95]
    grad_clip: 5.0
    sim_weight: 25.0
    var_weight: 25.0
    cov_weight: 1.0
data:
    batch_size: 64
    accumulation_steps: 2
    n_patients: 5000 # 0=all
    max_encounters: null # null = no limit
    pin_mem: True
    num_workers: 0
sae_config:
    z_enc:
        n_features: 256
        top_k: 12
        epochs: 200
        lr: 3e-4
        batch_size: 8
meta:
    seed: 42
    use_bfloat16: False
    tag: "jepa_stopg_mini"
    description: "Testing successful training (stopgrad) and pipeline"
    resume_from: null # provide path to .pt checkpoint. tag must match.
    save_ckpt_every: 10 # null = once at end
    save_emb_every: 5 # null = once at end; Embeddings are sent to tb every epoch