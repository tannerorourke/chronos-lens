# (embed_dim 256, stopgrad, seed 44)
model:
    embed_dim: 256
    encoder_heads: 8
    encoder_depth: 4
    encoder_ffn_dim: 1024        # ~4x embed_dim
    token_enc_heads: 2
    token_enc_depth: 2
    token_enc_ffn_dim: 512      # ~2x embed_dim
    predictor_embed_dim: 128     # ~0.5x embed_dim (bottleneck)
    predictor_heads: 4
    predictor_depth: 3
    predictor_ffn_dim: 512      # ~2x embed_dim
    projector_dim: 1024         # ~4x embed_dim (matters to VICReg)
    architecture: stopgrad
optimization:
    epochs: 75
    warmup_epochs: 7     # ~10% of optimizer steps
    patience: 15
    base_lr: 3e-4
    min_lr: 1e-5
    weight_decay: 0.05
    betas: [0.9, 0.95]
    grad_clip: 2.0
vicreg:
    sim_wt: 1.0
    var_wt: 1.0
    cov_wt: 0.04       # .mean()-normalized -> D-invariant; nudge up only if cov creeps at 1024
    on_enc: True
    on_tgt: True
    on_pred: False
data:
    batch_size: 64
    accumulation_steps: 3
    n_patients: 0
    max_encounters: 20
    pin_mem: true
    num_workers: 0
meta:
    seed: 44
    use_bfloat16: True
    tag: "sg-vr_256"
    description: "Stop-grad JEPA + VICReg, embed_dim 256, seed 44 (scaling ladder)"
    resume_from: null
    save_cycle: 5
    sync_s3: true      # S3 archive always on - embeddings/vectors get huge at scale; flag kept as off-switch
sae_config:
    z_enc:
        n_features: 1024      # ~4x embed_dim
        top_k: 32
        epochs: 30
        lr: 1e-3
        batch_size: 512
    pred_error:
        n_features: 1024
        top_k: 32
        epochs: 30
        lr: 1e-3
        batch_size: 512
