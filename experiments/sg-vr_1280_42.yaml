# embed_dim 1280, stopgrad, seed 42
model:
    embed_dim: 1280
    encoder_heads: 16
    encoder_depth: 8
    encoder_ffn_dim: 5120 # ~4x embed_dim
    token_enc_heads: 8
    token_enc_depth: 2
    token_enc_ffn_dim: 2560 # ~2x embed_dim
    predictor_embed_dim: 640 # ~0.5x embed_dim (bottleneck)
    predictor_heads: 8
    predictor_depth: 4
    predictor_ffn_dim: 2560 # ~2x embed_dim
    projector_dim: 5120 # ~4x embed_dim (matters to VICReg)
    architecture: stopgrad
optimization:
    epochs: 75
    warmup_epochs: 8 # ~10% of optimizer steps
    patience: 15
    base_lr: 2e-4
    min_lr: 1e-5
    weight_decay: 0.05
    betas: [0.9, 0.95]
    grad_clip: 2.0
vicreg:
    sim_wt: 1.0
    var_wt: 2.0 # constant for this sweep
    cov_wt: 0.04
    on_enc: True
    on_tgt: True
    on_pred: False
data:
    batch_size: 192
    accumulation_steps: 1
    n_patients: 0
    max_encounters: 20
    pin_mem: true
    num_workers: 8
meta:
    seed: 42
    tag: "sg-vr_1280_42"
    description: "Stop-grad JEPA + VICReg, embed_dim 1280, seed 42 (stretch)"
    resume_from: null
    ckpt_cycle: 5
    sync_s3: true
sae_config:
    z_enc:
        n_features: 5120 # ~4x embed_dim
        top_k: 32
        epochs: 30
        lr: 1e-3
        batch_size: 512
    pred_error:
        n_features: 5120
        top_k: 32
        epochs: 30
        lr: 1e-3
        batch_size: 512
