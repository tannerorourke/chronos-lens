model:
    embed_dim: 128
    num_heads: 8
    num_layers: 4
    ffn_dim: 512
    max_seq_len: 128
    predictor_embed_dim: 64
    predictor_depth: 2
    architecture: ema
optimization:
    epochs: 100
    warmup_epochs: 10
    patience: 15
    base_lr: 6e-4
    min_lr: 1e-5
    schedule: "warmup_cosine"
    weight_decay: 0.05
    betas: [0.9, 0.95]
    grad_clip: 2.0
    ema: [0.996, 0.9995]
data:
    batch_size: 128
    accumulation_steps: 2
    n_patients: 0 # 0=all
    max_encounters: null # null = no limit
    pin_mem: true
    num_workers: 0
meta:
    seed: 42
    use_bfloat16: True
    tag: "jepa_ema_42_v01"
    description: "First optimization run with EMA JEPA (iJEPA), seed 42"
    resume_from: null # provide path to .pt checkpoint. tag must match.
    save_ckpt_every: 10 # null = once at end
    save_emb_every: 10 # null = once at end; Embeddings are sent to tb every epoch
