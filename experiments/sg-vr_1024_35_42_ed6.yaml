# embed_dim 1024, stopgrad, seed 42 - ablation: encoder_depth 6 (vs 8 headline).
# Question (RESEARCH_Qs Q18): the width ladder confounds width with depth (256:d4, 512/768:d6,
# 1024:d8). Holding width at 1024 and dropping depth to 6 disentangles them: 1024-d8 vs
# 1024-d6 isolates depth at fixed width, and 768-d6 vs 1024-d6 isolates width at fixed depth.
# Only encoder_depth differs.
model:
    embed_dim: 1024
    encoder_heads: 16
    encoder_depth: 6 # ABLATION knob: depth 6 (headline is 8)
    encoder_ffn_dim: 4096 # ~4x embed_dim
    token_enc_heads: 8
    token_enc_depth: 2
    token_enc_ffn_dim: 2048 # ~2x embed_dim
    predictor_embed_dim: 512 # ~0.5x embed_dim (bottleneck)
    predictor_heads: 8
    predictor_depth: 4
    predictor_ffn_dim: 2048 # ~2x embed_dim
    projector_dim: 4096 # ~4x embed_dim (matters to VICReg)
    architecture: stopgrad
optimization:
    epochs: 35
    warmup_epochs: 8 # ~10% of 75-ep steps; longer fraction here (35-ep run)
    patience: 15
    base_lr: 2e-4
    min_lr: 1e-5
    weight_decay: 0.05
    betas: [0.9, 0.95]
    grad_clip: 2.0
vicreg:
    sim_wt: 1.0
    var_wt: 2.0
    cov_wt: 0.04
    on_enc: True
    on_tgt: True
    on_pred: False
data:
    batch_size: 128
    accumulation_steps: 2 # effective batch 256 (micro 128 for A100 headroom)
    n_patients: 0
    max_encounters: 20
    pin_mem: true
    num_workers: 8
meta:
    seed: 42
    tag: "sg-vr_1024_35_42_ed6"
    description: "Stop-grad JEPA + VICReg, embed_dim 1024, seed 42 - ablation encoder_depth 6 (35 ep)"
    resume_from: null
    ckpt_cycle: 5
    log_tb: True
    log_csv: True
    sync_s3: true
sae_config:
    z_enc:
        n_features: 4096 # ~4x embed_dim
        top_k: 32
        epochs: 30
        lr: 1e-3
        batch_size: 512
    pred_error:
        n_features: 4096
        top_k: 32
        epochs: 30
        lr: 1e-3
        batch_size: 512
