model:
    embed_dim: 128
    encoder_heads: 8
    encoder_depth: 4
    encoder_ffn_dim: 512 # 2-4x embed_dim
    token_enc_heads: 2
    token_enc_depth: 2
    token_enc_ffn_dim: 256 # 2-4x embed_dim
    predictor_embed_dim: 96 # 0.5/1x embed_dim
    predictor_heads: 4
    predictor_depth: 2
    predictor_ffn_dim: 192 # 2-4x embed_dim (start high)
    projector_dim: 256 # 2-4x embed_dim (matters to vicreg)
    architecture: ema
optimization:
    epochs: 100
    warmup_epochs: 10 # 0.1 epochs
    patience: 15
    base_lr: 6e-4
    min_lr: 1e-5
    weight_decay: 0.05
    betas: [0.9, 0.95]
    grad_clip: 2.0
    ema: [0.996, 0.9995]
vicreg:
    sim_wt: 1.0
    var_wt: 1.0
    cov_wt: 0.04
    on_enc: True
    on_tgt: False
    on_pred: False
data:
    batch_size: 64
    accumulation_steps: 3
    n_patients: 0
    max_encounters: 20
    pin_mem: true
    num_workers: 0
meta:
    seed: 42
    use_bfloat16: True
    tag: "jepa_ema_42_v01"
    description: "1st EMA VicReg run, with token encoder and sin-pos encoding, seed 42"
    resume_from: null
    save_cycle: 5