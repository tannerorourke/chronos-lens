# Tiny LOCAL CPU smoke-test config (EMA JEPA + VICReg). NOT for Lambda/GPU.
# Purpose: exercise the full pipeline end-to-end on a laptop -
#   train -> embeddings extract -> analyze_* -> SAE -> probe sweep.
# Everything is shrunk: 32-d model, 200 patients, <=8 encounters, few epochs.
#
# NOTE on checkpoints: every loop now saves unconditionally - a rolling `last.pt`
# every `ckpt_cycle` epochs plus a preserved `checkpoint_<final_epoch>.pt` at the
# end (no dependence on loss dynamics). The training entrypoint then always
# extracts `embeddings_<final_epoch>.npz` from that final checkpoint.
model:
    embed_dim: 32
    encoder_heads: 4         # must divide embed_dim
    encoder_depth: 2
    encoder_ffn_dim: 64
    token_enc_heads: 2
    token_enc_depth: 1
    token_enc_ffn_dim: 64
    predictor_embed_dim: 32
    predictor_heads: 2
    predictor_depth: 1
    predictor_ffn_dim: 64
    projector_dim: 64
    architecture: ema
optimization:
    epochs: 12
    warmup_epochs: 1
    patience: 3
    base_lr: 3e-4
    min_lr: 1e-5
    weight_decay: 0.05
    betas: [0.9, 0.95]
    grad_clip: 2.0
    ema: [0.996, 0.9995]
vicreg:
    sim_wt: 1.0
    var_wt: 1.0
    cov_wt: 0.04
    on_enc: True
    on_tgt: False
    on_pred: False
data:
    batch_size: 16
    n_patients: 200          # 0=all; small subset for CPU
    max_encounters: 8
    pin_mem: false           # CPU
    num_workers: 0
meta:
    seed: 42
    tag: "test"
    description: "Tiny local CPU smoke-test (EMA). Exercises train -> embeddings -> analyze -> SAE -> probe."
    resume_from: null
    ckpt_cycle: 1
    save_emb_every: 1
# SAE leaf configs are never code-generated (only read at io.py:251) and are
# frozen into the run, so authoring them here is what enables
# `python -m scripts.train --exp test sae --target <z_enc|pred_error>` locally.
sae_config:
    z_enc:
        n_features: 128  # ~4x embed_dim
        top_k: 8
        epochs: 2
        lr: 1e-3
        batch_size: 256
    pred_error:
        n_features: 128
        top_k: 8
        epochs: 2
        lr: 1e-3
        batch_size: 256
