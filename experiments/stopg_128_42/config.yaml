model:
    embed_dim: 128
    num_heads: 8
    num_layers: 4
    ffn_dim: 512
    max_seq_len: 128
    predictor_embed_dim: 64
    predictor_depth: 2
    architecture: stopgrad
optimization:
    epochs: 100
    base_lr: 3e-4
    schedule: "warmup_cosine"
    warmup_epochs: 10
    sim_weight: 1.0
    var_weight: 1.0
    cov_weight: 0.04
data:
    batch_size: 32
    accumulation_steps: 2
    n_patients: 0 # 0=all
    max_encounters: null # null = no limit
    pin_mem: true
    num_workers: 0
sae_config:
    n_features: 256
    top_k: 12
    epochs: 200
    lr: 3e-4
    batch_size: 8
meta:
    seed: 42
    use_bfloat16: True
    tag: "jepa_stopg_42_v01"
    description: "First optimization run with Stopgrad JEPA, seed 42"
    resume_from: null # provide path to .pt checkpoint. tag must match.
    save_every: 10 # null = once at end; Includes checkpoints and model vectors