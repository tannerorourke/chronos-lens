model:
    embed_dim: 64
    num_heads: 8
    num_layers: 2
    ffn_dim: 256
    max_seq_len: 128
    predictor_hidden: 128
    architecture: stopgrad
    use_bfloat16: True

optimization:
    epochs: 100
    base_lr: 3e-4
    schedule: "warmup_cosine"
    warmup_epochs: 0.1
    sim_weight: 1.0
    var_weight: 1.0
    cov_weight: 0.04

data:
    batch_size: 64
    n_patients: 1000
    pad_idx: 0
    max_encounters: null    # max encounters per patient (null = no limit)
    max_tokens: null         # max tokens per encounter (null = no limit)

artifacts:
    log_emb_vecs: True
    checkpoint_every: 10
    log_emb_vecs_every: 10

meta:
    tag: "sg_v01"
    description: "First optimization run with Stopgrad JEPA"