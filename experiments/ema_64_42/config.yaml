model:
    embed_dim: 64
    num_heads: 8
    num_layers: 2
    ffn_dim: 256
    max_seq_len: 128
    predictor_embed_dim: 32
    predictor_depth: 2
    architecture: ema
optimization:
    epochs: 100
    base_lr: 3e-4
    schedule: "warmup_cosine"
    warmup_epochs: 10
    weight_decay: 0.05
    betas: [0.9, 0.95]
    grad_clip: 5.0
    ema: [0.998, 1.0]
data:
    batch_size: 64
    accumulation_steps: 2
    n_patients: 0 # 0=all
    max_encounters: null # null = no limit
    pin_mem: true
    num_workers: 0
meta:
    seed: 42
    use_bfloat16: True
    tag: "jepa_ema_42_v01"
    description: "First optimization run with EMA JEPA (iJEPA), seed 42"
    resume_from: null # provide path to .pt checkpoint. tag must match.
    save_ckpt_every: 10 # null = once at end
    save_emb_every: 5 # null = once at end; Embeddings are sent to tb every epoch
