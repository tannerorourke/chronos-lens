model:
    embed_dim: 64
    num_heads: 8
    num_layers: 2
    ffn_dim: 256
    max_seq_len: 128
    architecture: supervised
optimization:
    epochs: 100
    base_lr: 3e-4
    schedule: "warmup_cosine"
    warmup_epochs: 10
data:
    label_key: "label_30d"
    batch_size: 64
    n_patients: 1000 # 0=all
    max_encounters: null # null = no limit
    pin_mem: true
    num_workers: 0
meta:
    seed: 42
    use_bfloat16: True
    tag: "supervised_v01"
    description: "Supervised Transformer baseline for JEPA comparison"
    resume_from: null # provide path to .pt checkpoint. tag must match.
    save_every: 10 # null = once at end; Includes checkpoints and model vectors