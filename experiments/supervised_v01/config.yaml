model:
    embed_dim: 64
    num_heads: 8
    num_layers: 2
    ffn_dim: 256
    max_seq_len: 128
    architecture: supervised

optimization:
    epochs: 100
    base_lr: 3e-4
    schedule: "warmup_cosine"
    warmup_epochs: 0.1

data:
    batch_size: 64
    n_patients: 1000
    modality: "all"
    eval: "90d_readmit"
    max_encounters: null
    max_tokens: null
    pin_mem: true
    root_path: "/data/processed"

meta:
    seed: 42
    use_bfloat16: True
    tag: "supervised_v01"
    description: "Supervised Transformer baseline for JEPA comparison"
    resume_from: null
    log_vecs: True
    log_vecs_every: 10
    checkpoint_every: 10
    logdir: "experiments/supervised_v01"
