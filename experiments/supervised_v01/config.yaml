model:
    embed_dim: 64
    num_heads: 8
    num_layers: 2
    ffn_dim: 256
    max_seq_len: 128
    architecture: supervised
optimization:
    epochs: 100
    base_lr: 3e-4
    schedule: "warmup_cosine"
    warmup_epochs: 10
data:
    batch_size: 64
    n_patients: 1000 # 0=all
    eval: "90d_readmit" # 30d_readmit | 90d_readmit | next_icd_block
    max_encounters: null # null = no limit
    max_tokens: null
    pin_mem: true
meta:
    seed: 42
    use_bfloat16: True
    tag: "supervised_v01"
    description: "Supervised Transformer baseline for JEPA comparison"
    resume_from: null # provide path to .pt checkpoint. tag must match.
    log_vecs: True
    log_vecs_every: 10 # null = once at end
    checkpoint_every: 10
