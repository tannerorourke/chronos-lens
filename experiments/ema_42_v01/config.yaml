model:
    embed_dim: 64
    num_heads: 8
    num_layers: 2
    ffn_dim: 256
    max_seq_len: 128
    predictor_hidden: 128
    architecture: ema
optimization:
    epochs: 100
    base_lr: 3e-4
    schedule: "warmup_cosine"
    warmup_epochs: 0.1
    tau: 0.996
    ema_start: 0.996
    ema_end: 1.0
data:
    batch_size: 64
    modality: "all" # all | icd_only | meds_only
    eval: "90d_readmit" # 30d_readmit | 90d_readmit | next_icd_block
    max_encounters: null # null = no limit
    max_tokens: null
    pin_mem: true
    root_path: "/data/processed"
meta:
    seed: 42
    use_bfloat16: True
    tag: "jepa_ema_42_v01"
    description: "First optimization run with EMA JEPA (iJEPA), seed 42"
    resume_from: null # provide path to .pt checkpoint. tag must match.
    log_vecs: True
    log_vecs_every: 10 # null = once at end
    checkpoint_every: 10
    logdir: "experiments/ema_42_v01"
