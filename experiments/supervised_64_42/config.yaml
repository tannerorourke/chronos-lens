model:
    embed_dim: 64
    num_heads: 8
    num_layers: 2
    ffn_dim: 256
    architecture: supervised
optimization:
    epochs: 100
    warmup_epochs: 10
    patience: 15
    min_lr: 1e-5
    base_lr: 3e-4
    schedule: "warmup_cosine"
    weight_decay: 0.05
    betas: [0.9, 0.95]
    grad_clip: 2.0
data:
    label_key: "label_30d"
    batch_size: 64
    accumulation_steps: 2
    n_patients: 1000 # 0=all
    max_encounters: 150 # null = no limit
    pin_mem: true
    num_workers: 0
meta:
    seed: 42
    use_bfloat16: True
    tag: "supervised_v01"
    description: "Supervised Transformer baseline for JEPA comparison"
    resume_from: null # provide path to .pt checkpoint. tag must match.
    save_cycle: 5 # null = once at end