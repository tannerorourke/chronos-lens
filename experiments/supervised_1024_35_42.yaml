# embed_dim 1024, supervised, seed 42 - Lambda shakedown (35 ep, effective batch 256).
# Throwaway single-seed control probe at matched scale. Same encoder as the stop-grad
# rung; no predictor/projector/VICReg. Micro-batch 128 x accum 2 for A100-40GB headroom.
model:
    embed_dim: 1024
    encoder_heads: 16
    encoder_depth: 8
    encoder_ffn_dim: 4096 # ~4x embed_dim
    token_enc_heads: 8
    token_enc_depth: 2
    token_enc_ffn_dim: 2048 # ~2x embed_dim
    architecture: supervised
optimization:
    epochs: 35
    warmup_epochs: 8 # ~10% of 75-ep steps; longer fraction here (35-ep run)
    patience: 15
    base_lr: 2e-4
    min_lr: 1e-5
    weight_decay: 0.05
    betas: [0.9, 0.95]
    grad_clip: 2.0
data:
    label_key: "label_escalation"
    batch_size: 128
    accumulation_steps: 2 # effective batch 256 (micro 128 for A100 headroom)
    n_patients: 0
    max_encounters: 20
    pin_mem: true
    num_workers: 8
meta:
    seed: 42
    label_key: "label_escalation"
    tag: "supervised_1024_35_42"
    description: "Supervised transformer baseline, embed_dim 1024, seed 42 - Lambda shakedown (35 ep, label_escalation)"
    resume_from: null
    ckpt_cycle: 5
    log_tb: True
    log_csv: True
    sync_s3: true
sae_config:
    z_enc:
        n_features: 4096 # ~4x embed_dim
        top_k: 32
        epochs: 30
        lr: 1e-3
        batch_size: 512
