model:
    embed_dim: 64
    num_heads: 2
    num_layers: 2
    ffn_dim: 256
    max_seq_len: 128
    predictor_hidden: 128
    architecture: stopgrad
    use_bfloat16: True

optimization:
    epochs: 50
    base_lr: 1e-4
    schedule: "linear_decay"
    min_lr_ratio: 0.1
    sim_weight: 1.0
    var_weight: 1.0
    cov_weight: 0.04

data:
    batch_size: 64
    n_patients: 1000
    pad_idx: 0
    max_encounters: null    # max encounters per patient (null = no limit)
    max_tokens: null         # max tokens per encounter (null = no limit)

artifacts:
    log_emb_vecs: True
    checkpoint_every: 25
    log_emb_vecs_every: 0

meta:
    seed: 42
    tag: "test_01"
    description: "Testing successful training (stopgrad)"